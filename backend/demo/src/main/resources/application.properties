spring.application.name=demo

# Redis settings (used for session/message caching and room info)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.database=0
# keys expire after 5 minutes of inactivity
cache.message.ttl=300000

# example property for room info ttl
cache.room.ttl=300000
# message-history ttl already defined above as cache.message.ttl

# User service URL for status notifications
user.service.url=http://localhost:8081